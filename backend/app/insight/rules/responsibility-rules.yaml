# --------------------------------------------------------------------------------------------- risks
# Each risk reports a structural indicator that was found (status of the indicator) and a consequence that is reasoned (always INFERRED).
risks:
  RISK-SEC-NO-CONTROL:
    category: SECURITY
    title: Entry points with no detectable security control
    consequence: Requests that change data may be reachable without authentication or authorization unless a gateway or platform control exists.
    impact: A service boundary drawn here would expose these entry points without any control that moves with the code.
    investigate: Confirm the authentication and authorization controls in front of the application, then decide whether the extracted service needs its own.
    runtime_validation: true
    severity: HIGH
  RISK-SEC-PARTIAL:
    category: SECURITY
    title: Security controls on some entry points only
    consequence: Entry points without a control may be reachable by callers that the controlled ones exclude.
    impact: Splitting the capability would divide controlled and uncontrolled entry points between services.
    investigate: Check each uncontrolled entry point against the intended access policy.
    runtime_validation: true
    severity: MEDIUM
  RISK-OBS-NO-INSTRUMENTATION:
    category: OBSERVABILITY
    title: No logging, metrics or tracing reference found
    consequence: Failures and slow requests may be hard to diagnose, and distributed tracing would start from nothing after an extraction.
    impact: Splitting a request across services without instrumentation makes the combined flow hard to follow.
    investigate: Add structured logging and trace context before extracting a capability.
    runtime_validation: false
    severity: MEDIUM
  RISK-PERF-EAGER-FETCH:
    category: PERFORMANCE
    title: Eagerly fetched relationships
    consequence: Loading one record may load a graph of related records, which can cause many database calls per request.
    impact: Extracting one side of an eager relationship would turn in-process loading into remote calls or force a data copy.
    investigate: Compare with the Performance tab (database calls per request on the routes that load these entities), then decide on lazy loading or explicit queries.
    runtime_validation: true
    severity: MEDIUM
  RISK-PERF-UNBOUNDED-QUERY:
    category: PERFORMANCE
    title: Repository query that returns a whole collection
    consequence: The result size grows with the table, so response time and memory may grow with it.
    impact: A remote call returning an unbounded collection would be costly and fragile across a service boundary.
    investigate: Check the table size in production and add paging where it can grow.
    runtime_validation: true
    severity: MEDIUM
  RISK-DATA-SHARED-MODEL:
    category: DATA_INTEGRITY
    title: Persistent classes shared across candidate domains
    consequence: Two or more capabilities depend on one persistence model, so a change to it affects all of them and the data cannot be owned by one service.
    impact: The shared model must become a shared library or be duplicated before the capabilities can be separated.
    investigate: Decide which capability owns the data and whether the others can depend on a published contract instead.
    runtime_validation: false
    severity: HIGH
  RISK-DATA-TX-SPAN:
    category: DATA_INTEGRITY
    title: Transactional method that touches two or more candidate domains
    consequence: One transaction covers data of two or more capabilities, so separating them needs a distributed consistency approach.
    impact: Extraction would turn a local transaction into a distributed one.
    investigate: Map the writes in this method and decide on a saga, an outbox or keeping the capabilities together.
    runtime_validation: true
    severity: HIGH
  RISK-SCAL-STATIC-STATE:
    category: SCALABILITY
    title: Mutable static state
    consequence: Instances share this state, so running two or more instances can give different results and threads may race on it.
    impact: Independent scaling of a service containing this class would need the state to move to a shared store.
    investigate: Check whether the state is guarded and whether it must be shared between instances.
    runtime_validation: true
    severity: MEDIUM
  RISK-MAINT-RESPONSIBILITIES:
    category: MAINTAINABILITY
    title: Class with many distinct responsibilities
    consequence: Changes for one concern are likely to touch code serving another, which raises the cost and risk of change.
    impact: The class is hard to place inside one service boundary.
    investigate: Separate the concerns before deciding which boundary the class belongs to.
    runtime_validation: false
    severity: MEDIUM
  RISK-MAINT-SHARED-COMPONENT:
    category: MAINTAINABILITY
    title: Shared component used from two or more candidate domains
    consequence: A change to this component can affect every domain that uses it.
    impact: Treat it as a shared library or module; making it a service would add a network call to every use.
    investigate: Check the change history and decide on the library versioning policy.
    runtime_validation: false
    severity: MEDIUM
  RISK-REL-NO-RESILIENCE:
    category: RELIABILITY
    title: Calls to other systems with no detectable timeout, retry or circuit breaker
    consequence: A slow or failing dependency may stall callers or spread failures.
    impact: Extraction adds more remote calls that would need the same protection.
    investigate: Confirm timeouts in client configuration, which a compiled artifact may not show.
    runtime_validation: true
    severity: HIGH
