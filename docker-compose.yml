name: archintel
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: archintel
      POSTGRES_USER: archintel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archintel -d archintel"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://archintel:${POSTGRES_PASSWORD}@postgres:5432/archintel
      DATA_DIR: /app/.data
      # Host-side runner (scripts/runner-start.sh) and opt-in model providers; all empty unless set in the ignored .env.
      RUNNER_URL: ${RUNNER_URL:-http://host.docker.internal:8790}
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
    ports: ["127.0.0.1:8000:8000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    # Local source checkouts for conversion (register them in Security & access as /app/sources/<name>); read-only.
    volumes: ["analysis-data:/app/.data", "./sources:/app/sources:ro"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ready', timeout=10)"]
      interval: 15s
      timeout: 12s
      retries: 10
volumes:
  postgres-data:
  analysis-data:
